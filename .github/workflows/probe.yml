name: probe-docker-store
on:
  push:
    branches: ['probe/**']
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-24.04]
        n: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Disks and space
        run: |
          df -h
          lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINT
          sudo du -xsh /usr/local/lib/node_modules /usr/local/share/* /usr/local/lib/* /opt/* /opt/hostedtoolcache/* /usr/lib/jvm /usr/share/* /usr/lib/* /var/lib/docker /var/lib/containerd /home/runner /snap /var/cache 2>/dev/null | sort -h | tail -30
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}'
