<!doctype html>
<html lang="en" data-theme="dark" data-mode="{{mode}}" data-run="{{run}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{run}}: OwnGenome</title>
<link rel="stylesheet" href="{{assets}}/live.css">
<script src="{{assets}}/core.js" defer></script>
<script src="{{assets}}/live.js" defer></script>
<script src="{{assets}}/person.js" defer></script>
{{plugins}}
</head>
<body class="page-person">
<header class="top">
  <a class="brand" href="/">OwnGenome</a>
  <nav class="crumbs" id="crumbs" aria-label="Where you are"><span id="run-name">{{run}}</span></nav>
  <div id="search-slot" class="search-slot"></div>
  <nav class="links"><a href="report.html" id="report-link">Report</a> <a href="/" id="home-link">All runs</a></nav>
</header>
<div id="replay" class="replay" hidden>
  <button type="button" id="replay-play">Play</button>
  <input type="range" id="replay-slider" min="0" max="0" value="0" aria-label="Moment of the run">
  <span id="replay-time"></span>
</div>
<section class="person-head" aria-label="This person">
  <h1><span id="avatar-slot"></span><span id="person-name">{{run}}</span> <span id="run-state" class="badge">loading</span></h1>
  <p id="person-line" class="person-line"></p>
  <a href="#progress" id="strip" class="strip" aria-label="Steps of the run: open the Progress tab"></a>
  <p id="strip-text" class="strip-text"></p>
</section>
<div class="layout">
  <nav id="rail" class="rail" role="tablist" aria-label="Chapters" aria-orientation="vertical"></nav>
  <main id="content">
    <section id="results" class="results" role="tabpanel" hidden></section>
    <section id="progress" class="progress" role="tabpanel" aria-label="Progress">
      <div class="progress-grid">
        <section class="map-wrap" aria-label="Steps">
          <div id="legend" class="legend"></div>
          <div id="map"></div>
        </section>
        <aside class="side">
          <section id="detail" class="card" aria-live="polite"><h2>Step</h2><p class="dim">Click a step to see its tasks.</p></section>
          <section class="card"><h2>Found so far</h2><ul id="found" class="found"><li class="dim">Nothing finished yet.</li></ul></section>
          <div id="plugin-panels"></div>
        </aside>
      </div>
    </section>
  </main>
</div>
</body>
</html>
