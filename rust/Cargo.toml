[workspace]
resolver = "3"
members = ["crates/pycompat", "crates/og-io", "crates/og-vcf", "crates/og-bam", "crates/og-map", "crates/og-tsv", "crates/og-intervals", "crates/og-dev", "crates/og-filters", "crates/og-nf", "crates/og-runlog", "crates/og-steps", "crates/og-chip", "crates/og-pedigree", "og"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
pycompat = { path = "crates/pycompat" }
og-io = { path = "crates/og-io" }
og-vcf = { path = "crates/og-vcf" }
og-bam = { path = "crates/og-bam" }
og-map = { path = "crates/og-map" }
og-tsv = { path = "crates/og-tsv" }
og-intervals = { path = "crates/og-intervals" }
og-dev = { path = "crates/og-dev" }
og-filters = { path = "crates/og-filters" }
og-nf = { path = "crates/og-nf" }
og-runlog = { path = "crates/og-runlog" }
og-steps = { path = "crates/og-steps" }
og-chip = { path = "crates/og-chip" }
og-pedigree = { path = "crates/og-pedigree" }
indexmap = "2"
flate2 = "1"
memchr = "2"
smallvec = "1"
# Time zones as Python reads them: TZ, else /etc/localtime, else UTC.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# statvfs(2) without unsafe code.
rustix = { version = "1", default-features = false, features = ["std", "fs", "system"] }
# Pure Rust deflate for BGZF (no C to cross-compile); the backend noodles-bgzf uses.
zlib-rs = { version = "0.6", default-features = false, features = ["std"] }
# htslib built from source and linked statically. curl, S3 and GCS are
# off (og reads local files only), and so are bzip2 and lzma, which only
# CRAM uses.
rust-htslib = { version = "=1.0.2", default-features = false, features = ["static"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
